<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1400px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        .product {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            background-color: #f9f9f9;
            max-width: 1200px;
            width: 100%;
        }
        .product img {
            border-radius: 5px;
            margin-right: 20px;
        }
        .product-details {
            flex: 1;
        }
        .product-details div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container" align="center">
        <h1>All Data:</h1>
        <div th:each="product : ${lis}" class="product">
            <img th:src="'/img/' + ${product.id}" alt="Product Image" height="200" width="200"/>
            <div class="product-details">
                <div>ID: <span th:text="${product.id}"></span></div>
                <div>Name: <span th:text="${product.pname}"></span></div>
                <div>Price: <span th:text="${product.price}"></span></div>
            </div>
        </div>
    </div>
</body>
</html>
