<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Product Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    .box input[type="text"], .box input[type="number"], .box input[type="file"] {
        width: calc(100% - 22px);
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .box input[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .box input[type="submit"]:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<form action="/addcus" method="post" enctype="multipart/form-data">
    <div class="box">
        <label for="pname">Enter product name:</label>
        <input type="text" id="pname" name="pname"><br>
        <label for="price">Enter product price:</label>
        <input type="number" id="price" name="price"><br>
        <label for="file">Upload product image:</label>
        <input type="file" id="file" name="file"><br>
        <input type="submit" value="Submit">
    </div>
</form>

</body>
</html>
